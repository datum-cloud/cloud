# The central allocator of a network's fabric identity. It is its own overlay
# because it does not run where the cell manager runs: a network spans
# locations, so the one value that has to be the same in all of them cannot be
# decided in any one of them.
#
# The manager itself runs against the federation hub rather than the cluster it
# is scheduled on. Everything it reads is there — the Network and its
# NetworkContexts, both mirrored on to the hub by the network operator — and
# everything it writes is there too, so the leader election that keeps one
# network to one identity belongs on the same plane as the writes it guards.
#
# RBAC comes from ../rbac unchanged. The repo generates one ClusterRole from
# every marker under ./internal/..., so both roles this image runs share a role
# and a ServiceAccount name; splitting them means splitting the generator, and
# the role is only ever bound in one namespace per deployment.
#
# The ClusterRole is what an operator binds to the federation credential's
# identity ON THE HUB — that is where every read and every write this component
# makes lands, including its leader election lease. The binding here exists
# because the pod needs a ServiceAccount to exist; it authorises nothing this
# component actually uses.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fabric-identity-system
resources:
  - namespace.yaml
  - ../crd
  - ../rbac
components:
  - ../components/fabric-identity
