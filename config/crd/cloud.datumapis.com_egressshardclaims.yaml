---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: egressshardclaims.cloud.datumapis.com
spec:
  group: cloud.datumapis.com
  names:
    kind: EgressShardClaim
    listKind: EgressShardClaimList
    plural: egressshardclaims
    singular: egressshardclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.attachment.name
      name: Attachment
      type: string
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.shardRef.name
      name: Shard
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EgressShardClaim records one attachment's egress shard: the shard on the
          node the attachment landed on.

          There is one claim per attachment, owned by it, so an attachment that goes
          takes its record with it. The claim names no selector, no address and no
          pool: the node is the binding, and the claim writes it down.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EgressShardClaimSpec is one attachment being recorded against the egress
              shard on its node.

              The claim decides nothing. The node already routes toward its own shard from
              the moment the attachment exists; the claim records which shard that is, so
              the binding is readable, so a node without a usable shard produces a
              condition a consumer can see, and so a later tier that does select among
              shards binds through the same object.

              The whole spec is immutable. An attachment that lands on a different node is
              a different record, so the claim is replaced rather than edited.
            properties:
              attachment:
                description: |-
                  Attachment is the attachment this claim records egress for. The claim
                  carries the attachment's name and namespace, so the two are read by one
                  key.
                properties:
                  name:
                    description: Name of the VPCAttachment.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              families:
                description: |-
                  Families are the destination address families the network declared,
                  so the shard on the node is one that translates them.
                items:
                  description: |-
                    InternetEgressAddressFamily is the address family of an egress source
                    address.

                    Only IPv6 is reported. Reaching an IPv4 destination needs a resolver and a
                    translator sharing a prefix, which the platform pairs neither of, so the
                    value is withheld rather than reported and not delivered. An address written
                    today records IPv6, so accepting IPv4 later changes no attachment.
                  enum:
                  - IPv6
                  type: string
                maxItems: 2
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              nodeName:
                description: |-
                  NodeName is the node the attachment landed on, and therefore the node
                  whose shard serves it.
                minLength: 1
                type: string
            required:
            - attachment
            - families
            - nodeName
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; an attachment that moved nodes gets a new
                claim
              rule: self == oldSelf
          status:
            description: EgressShardClaimStatus is the shard an attachment was recorded
              against.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              shardRef:
                description: |-
                  ShardRef is the shard on the attachment's node.

                  Absent means the node holds no shard this claim can record, which is
                  what an attachment on a node an operator has not commissioned reads.
                properties:
                  name:
                    description: Name of the EgressShard.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the EgressShard.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
