---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: egressshardclaims.cloud.datumapis.com
spec:
  group: cloud.datumapis.com
  names:
    kind: EgressShardClaim
    listKind: EgressShardClaimList
    plural: egressshardclaims
    singular: egressshardclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.network.name
      name: Network
      type: string
    - jsonPath: .spec.sharing
      name: Sharing
      type: string
    - jsonPath: .status.shardRef.name
      name: Shard
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EgressShardClaim is one network being bound to one egress shard in this cell.

          There is one claim per network context that declares egress — not one per
          interface and not one per attachment. The binding has to outlive the
          workloads using it: an instance is replaced routinely, and a binding that
          followed an attachment would move a network's source address every time that
          happened, which is the address a consumer allow-listed at their destination.

          The claim names no shard, no selector, no address and no pool. It states what
          the network needs and the cell answers with which shard serves it, the same
          division a subnet claim makes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the network being bound and the terms the binding
              satisfies
            properties:
              className:
                description: |-
                  ClassName is the InternetEgressClass resolved for this network. It is
                  recorded rather than read: the class is cluster-scoped upstream and no
                  copy of it reaches this cell.
                maxLength: 253
                minLength: 1
                type: string
              families:
                description: |-
                  Families are the destination address families this binding has to reach,
                  so the shard it binds is one that translates them.
                items:
                  description: |-
                    InternetEgressAddressFamily is the address family of an egress source
                    address.

                    Only IPv6 is reported. Reaching an IPv4 destination needs a resolver and a
                    translator sharing a prefix, which the platform pairs neither of, so the
                    value is withheld rather than reported and not delivered. An address written
                    today records IPv6, so accepting IPv4 later changes no attachment.
                  enum:
                  - IPv6
                  type: string
                maxItems: 2
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              network:
                description: Network is the network reaching the internet.
                properties:
                  name:
                    description: Name of the Network.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              networkContext:
                description: |-
                  NetworkContext is that network's presence in this cell, which is what
                  makes the claim one per location.
                properties:
                  name:
                    description: Name of the NetworkContext.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              sharing:
                description: Sharing is how many networks that class allows on one
                  shard.
                enum:
                - Shared
                - Dedicated
                type: string
            required:
            - className
            - families
            - network
            - networkContext
            - sharing
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; a binding is decided once, so delete the
                claim to ask for different terms
              rule: self == oldSelf
          status:
            description: status is the binding
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              shardRef:
                description: |-
                  ShardRef is the shard this network egresses through.

                  Absent means no shard is bound, which is what a location whose cell holds
                  no usable shard reads. Nothing publishes an address or a route in that
                  state: an address a consumer might allow-list is withheld until the
                  platform can state which one their packets leave on.

                  Present is permanent for this claim's life. It is written once, and
                  nothing recomputes it: a rebinding would move a live VPC's egress to a
                  different source address, which is the value a consumer allow-listed at
                  their destination.
                properties:
                  name:
                    description: Name of the shard.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace holding the shard. It is stated rather than assumed: the
                      shards are in the namespace an operator gave the serving class, which is
                      not the namespace a claim lives in.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
