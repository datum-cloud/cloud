apiVersion: v1
kind: Namespace
metadata:
  name: vpc-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpc-controller
  namespace: vpc-system
  labels:
    app.kubernetes.io/name: vpc-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vpc-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vpc-controller
    spec:
      serviceAccountName: vpc-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/datum-cloud/vpc-controller:latest
          args:
            - --leader-elect
            # Required. Hypervisor for microVM cells, Netns for container cells.
            - --attachment-mode=Hypervisor
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: metrics
              containerPort: 8080
            - name: webhook
              containerPort: 9443
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: webhook-certs
          secret:
            secretName: webhook-server-cert
      terminationGracePeriodSeconds: 10
