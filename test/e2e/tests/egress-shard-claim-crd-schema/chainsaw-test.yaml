apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: egress-shard-claim-crd-schema
spec:
  description: >
    Verify schema validation and storage for the EgressShardClaim CRD. The rule that
    matters most is the immutable spec: a claim records the node an attachment landed
    on, and an attachment that moves is a new record rather than an edited one. Does
    not require any controller. CRD schema is enforced by the API server alone, and
    the recorded shard lives on status, which no consumer writes.
  steps:
    - name: create-valid-claim
      try:
        - apply:
            resource:
              apiVersion: cloud.datumapis.com/v1alpha1
              kind: EgressShardClaim
              metadata:
                name: web-eth0
              spec:
                attachment:
                  name: web-eth0
                nodeName: worker-3
                families:
                  - IPv6
        - assert:
            resource:
              apiVersion: cloud.datumapis.com/v1alpha1
              kind: EgressShardClaim
              metadata:
                name: web-eth0
              spec:
                nodeName: worker-3

    - name: reject-spec-change
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -n "$NAMESPACE" -f - 2>&1 <<'EOF'
              apiVersion: cloud.datumapis.com/v1alpha1
              kind: EgressShardClaim
              metadata:
                name: web-eth0
              spec:
                attachment:
                  name: web-eth0
                nodeName: worker-4
                families:
                  - IPv6
              EOF
              )
              EXIT=$?
              set -e
              if [ "$EXIT" -eq 0 ]; then
                echo "ERROR: the node a record was written for was changed under it"
                exit 1
              fi
              echo "$OUTPUT" | grep -q "spec is immutable" || {
                echo "ERROR: rejected for the wrong reason: $OUTPUT"
                exit 1
              }
              echo "OK: the record is immutable once written"

    - name: reject-ipv4-family
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -n "$NAMESPACE" -f - 2>&1 <<'EOF'
              apiVersion: cloud.datumapis.com/v1alpha1
              kind: EgressShardClaim
              metadata:
                name: web-eth0-v4
              spec:
                attachment:
                  name: web-eth0
                nodeName: worker-3
                families:
                  - IPv4
              EOF
              )
              EXIT=$?
              set -e
              if [ "$EXIT" -eq 0 ]; then
                echo "ERROR: an IPv4 family was accepted, which no shard translates"
                exit 1
              fi
              echo "OK: IPv4 is refused"

    - name: reject-missing-node
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -n "$NAMESPACE" -f - 2>&1 <<'EOF'
              apiVersion: cloud.datumapis.com/v1alpha1
              kind: EgressShardClaim
              metadata:
                name: web-eth0-nonode
              spec:
                attachment:
                  name: web-eth0
                families:
                  - IPv6
              EOF
              )
              EXIT=$?
              set -e
              if [ "$EXIT" -eq 0 ]; then
                echo "ERROR: a claim naming no node was accepted"
                exit 1
              fi
              echo "OK: a node is required"
