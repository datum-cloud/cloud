apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: egress-shard-pool-crd-schema
spec:
  description: >
    Verify schema validation for the EgressShardPool CRD. A pool declares the egress
    shards a cell has, and the rule that matters most is the one refusing an empty node
    selector: a pool matching every node would build a shard per node and make the egress
    address per-node, which dissolves the shared address the model rests on. Does not
    require any controller — CRD schema is enforced by the API server alone.
  steps:
    - name: create-valid-pool
      try:
        - apply:
            resource:
              apiVersion: cloud.datumapis.com/v1alpha1
              kind: EgressShardPool
              metadata:
                name: e2e-shared
              spec:
                shardNamespace: galactic-system
                nodeSelector:
                  matchLabels:
                    cloud.datumapis.com/egress-pool: e2e-shared
                shardLabels:
                  network.datumapis.com/egress-cell: e2e-cell
        - assert:
            resource:
              apiVersion: cloud.datumapis.com/v1alpha1
              kind: EgressShardPool
              metadata:
                name: e2e-shared
              spec:
                shardNamespace: galactic-system

    - name: reject-empty-node-selector
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -f - 2>&1 <<'EOF'
              apiVersion: cloud.datumapis.com/v1alpha1
              kind: EgressShardPool
              metadata:
                name: e2e-every-node
              spec:
                shardNamespace: galactic-system
                nodeSelector: {}
              EOF
              )
              EXIT=$?
              set -e
              if [ "$EXIT" -eq 0 ]; then
                echo "ERROR: a pool selecting every node was accepted"
                exit 1
              fi
              echo "$OUTPUT" | grep -q "at least one requirement" || {
                echo "ERROR: rejected for the wrong reason: $OUTPUT"
                exit 1
              }
              echo "OK: an empty node selector is refused"

    - name: reject-family-label
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -f - 2>&1 <<'EOF'
              apiVersion: cloud.datumapis.com/v1alpha1
              kind: EgressShardPool
              metadata:
                name: e2e-claims-ipv6
              spec:
                shardNamespace: galactic-system
                nodeSelector:
                  matchLabels:
                    cloud.datumapis.com/egress-pool: e2e-claims-ipv6
                shardLabels:
                  network.datumapis.com/egress-ipv6: "true"
              EOF
              )
              EXIT=$?
              set -e
              if [ "$EXIT" -eq 0 ]; then
                echo "ERROR: a pool claiming an address family it does not assign was accepted"
                exit 1
              fi
              echo "OK: the egress family labels are not settable by a pool"

    - name: reject-missing-shard-namespace
      try:
        - script:
            content: |
              set +e
              OUTPUT=$(kubectl apply -f - 2>&1 <<'EOF'
              apiVersion: cloud.datumapis.com/v1alpha1
              kind: EgressShardPool
              metadata:
                name: e2e-no-namespace
              spec:
                nodeSelector:
                  matchLabels:
                    cloud.datumapis.com/egress-pool: e2e-no-namespace
              EOF
              )
              EXIT=$?
              set -e
              if [ "$EXIT" -eq 0 ]; then
                echo "ERROR: a pool naming no shard namespace was accepted"
                exit 1
              fi
              echo "OK: a pool must name the namespace its shards live in"

    - name: delete-valid-pool
      try:
        - delete:
            ref:
              apiVersion: cloud.datumapis.com/v1alpha1
              kind: EgressShardPool
              name: e2e-shared
